version: "3.9"

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: saga-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saga-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "2026@Pass.Word"
    volumes:
      - sql_data:/var/opt/mssql

  orderservice:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    container_name: saga-orderservice
    depends_on:
      - rabbitmq
      - sqlserver
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  inventoryservice:
    build:
      context: .
      dockerfile: src/InventoryService/Dockerfile
    container_name: saga-inventoryservice
    depends_on:
      - rabbitmq
      - sqlserver
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  paymentservice:
    build:
      context: .
      dockerfile: src/PaymentService/Dockerfile
    container_name: saga-paymentservice
    depends_on:
      - rabbitmq
      - sqlserver
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  shippingservice:
    build:
      context: .
      dockerfile: src/ShippingService/Dockerfile
    container_name: saga-shippingservice
    depends_on:
      - rabbitmq
      - sqlserver
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

volumes:
  sql_data: